<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双星对比 · NBA 球员数据中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c8102e'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%23fdb927' stroke-width='2'/%3E%3Cpath d='M1 22 Q16 16 31 22 M16 1 V31 M8 8 Q16 16 24 8' fill='none' stroke='%23fdb927' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html"><span class="dot">🏀</span>NBA 球员数据中心</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="overview.html">数据总览</a>
        <a class="on" href="compare.html">双星对比</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" style="padding: 46px 0 10px">
      <span class="kicker">Head-to-Head</span>
      <h1 style="font-size: clamp(28px, 4vw, 42px)">双 星 对 比</h1>
      <p class="sub">输入两位球员（支持模糊匹配），对比 7 项生涯指标：双雷达 + 差值表 + 自动点评</p>

      <!-- 双选择器 -->
      <div class="vs-selects" id="vs-selects">
        <div class="combo" id="combo-a">
          <input id="pick-a" type="text" autocomplete="off" spellcheck="false"
                 placeholder="球员 A：如 iverson / 乔丹 ...">
          <ul hidden></ul>
        </div>
        <div class="vs">VS</div>
        <div class="combo" id="combo-b">
          <input id="pick-b" type="text" autocomplete="off" spellcheck="false"
                 placeholder="球员 B：如 james / 杜兰特 ...">
          <ul hidden></ul>
        </div>
      </div>
    </section>

    <!-- 对比结果区 -->
    <section id="compare-zone"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>数据源：Kaggle NBA Players Stats（1950–2017）· 分析内核：Python pandas / scikit-learn</span>
      <span>可视化：ECharts 本地打包 · 前端零构建 · 本页仅用于课程学习演示</span>
    </div>
  </footer>

  <script src="vendor/echarts.min.js"></script>
  <script type="module" src="js/compare.js"></script>
</body>
</html>
